packages:
  - ai-docs
  - packages/*
  - packages/tools/*

verifyDepsBeforeRun: error
enableGlobalVirtualStore: false

allowBuilds:
  core-js: false
  dprint: false
  esbuild: false

patchedDependencies:
  '@changesets/get-github-info@1.0.1': patches/@changesets__get-github-info@1.0.1.patch

minimumReleaseAgeExclude:
  - '@effect/tsgo-darwin-arm64@0.51.0'
  - '@effect/tsgo-darwin-x64@0.51.0'
  - '@effect/tsgo-linux-arm64@0.51.0'
  - '@effect/tsgo-linux-arm@0.51.0'
  - '@effect/tsgo-linux-x64@0.51.0'
  - '@effect/tsgo-win32-arm64@0.51.0'
  - '@effect/tsgo-win32-x64@0.51.0'
  - '@effect/tsgo@0.51.0'
